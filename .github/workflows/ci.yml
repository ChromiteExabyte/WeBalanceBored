name: CI

on:
  push:
    branches: [main, polish/windows-setup]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Validates that the protocol crate is genuinely portable. It has no
  # platform deps and no I/O — if this job ever fails on linux while the
  # windows job is green, something has leaked into the wrong layer.
  protocol-portable:
    name: protocol crate (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: protocol
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo test
        run: cargo test -p balance-board-protocol
      - name: cargo clippy
        run: cargo clippy -p balance-board-protocol --all-targets -- -D warnings

  # Builds and tests the entire workspace on the real target platform.
  # Catches hidapi build-script issues, raw-dylib resolution, anything
  # MSVC-specific.
  workspace:
    name: full workspace (${{ matrix.os }})
    strategy:
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
